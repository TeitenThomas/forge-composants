<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carte produit de boutique</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
      @custom-variant dark {
        @media (prefers-color-scheme: dark) {
          &:where(:root:not([data-theme="light"]), :root:not([data-theme="light"]) *) {
            @slot;
          }
        }
        &:where([data-theme="dark"], [data-theme="dark"] *) {
          @slot;
        }
      }
    </style>
  </head>
  <body class="grid grid-cols-1 min-h-screen place-items-center bg-[#fff8f9] font-sans text-[#3b0a18] dark:bg-[#12060a] dark:text-rose-100">
    <main class="mx-auto w-[min(100%_-_2rem,64rem)] py-8">
      <ul class="grid grid-cols-[repeat(auto-fit,minmax(min(100%,17rem),1fr))] gap-5">
      <li class="overflow-hidden rounded-[18px] border border-rose-100 bg-white dark:border-[#3e1a25] dark:bg-[#1d0b11]">
        <div aria-hidden="true" class="grid aspect-[4/3] place-items-center bg-rose-50 dark:bg-[#2a1018]"><svg class="w-[70%]" viewBox="0 0 180 160"><path d="M30 70 L90 50 L150 70 L150 120 L30 120 Z" fill="#b9b4ad" /></svg></div>
        <div class="grid gap-1.5 px-5 pt-4.5 pb-5">
          <h2 class="text-lg font-bold"><a href="#produit" class="hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-800 dark:focus-visible:outline-rose-300">Plaid en laine mérinos</a></h2>
          <p class="text-sm text-[#7a3a4a] dark:text-rose-200">Gris perle, 130 × 170 cm</p>
          <p class="mt-1 flex gap-1.5 text-sm"><span aria-hidden="true" class="tracking-widest text-amber-700 dark:text-amber-400">★★★★★</span><span class="sr-only">Note : 4,8 sur 5, 126 avis</span><span aria-hidden="true">4,8 (126)</span></p>
          <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
            <p class="text-2xl font-extrabold">89 €</p>
            <button type="button" class="min-h-11 cursor-pointer rounded-full bg-rose-800 px-4 text-sm font-semibold text-white hover:bg-rose-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-800 dark:bg-rose-300 dark:text-[#3b0a18] dark:hover:bg-rose-200 dark:focus-visible:outline-rose-300">Ajouter au panier</button>
          </div>
        </div>
      </li>
      <li class="overflow-hidden rounded-[18px] border border-rose-100 bg-white dark:border-[#3e1a25] dark:bg-[#1d0b11]">
        <div aria-hidden="true" class="grid aspect-[4/3] place-items-center bg-rose-50 dark:bg-[#2a1018]"><svg class="w-[70%]" viewBox="0 0 180 160"><path d="M45 60 Q90 40 135 60 L135 115 Q90 130 45 115 Z" fill="#c86f4f" /></svg></div>
        <div class="grid gap-1.5 px-5 pt-4.5 pb-5">
          <h2 class="text-lg font-bold"><a href="#produit" class="hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-800 dark:focus-visible:outline-rose-300">Coussin lin lavé</a></h2>
          <p class="text-sm text-[#7a3a4a] dark:text-rose-200">Terracotta, 45 × 45 cm</p>
          <p class="mt-1 flex gap-1.5 text-sm"><span aria-hidden="true" class="tracking-widest text-amber-700 dark:text-amber-400">★★★★★</span><span class="sr-only">Note : 4,6 sur 5, 58 avis</span><span aria-hidden="true">4,6 (58)</span></p>
          <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
            <p class="text-2xl font-extrabold">34 €</p>
            <button type="button" class="min-h-11 cursor-pointer rounded-full bg-rose-800 px-4 text-sm font-semibold text-white hover:bg-rose-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-800 dark:bg-rose-300 dark:text-[#3b0a18] dark:hover:bg-rose-200 dark:focus-visible:outline-rose-300">Ajouter au panier</button>
          </div>
        </div>
      </li>
      </ul>
    </main>
  </body>
</html>
