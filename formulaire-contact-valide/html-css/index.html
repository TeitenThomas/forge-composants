<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulaire de contact avec validation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo">
      <form class="vform" data-validate novalidate action="#envoi">
        <div class="vform__field">
          <label for="contact-name">Nom</label>
          <input id="contact-name" type="text" name="name" autocomplete="name" required minlength="2" aria-describedby="contact-name-error" />
          <p class="vform__error" id="contact-name-error"></p>
        </div>
        <div class="vform__field">
          <label for="contact-email">Adresse e-mail</label>
          <input id="contact-email" type="email" name="email" autocomplete="email" required aria-describedby="contact-email-error" />
          <p class="vform__error" id="contact-email-error"></p>
        </div>
        <div class="vform__field">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="5" required minlength="20" aria-describedby="contact-message-hint contact-message-error"></textarea>
          <p class="vform__hint" id="contact-message-hint">20 caractères au minimum.</p>
          <p class="vform__error" id="contact-message-error"></p>
        </div>
        <button type="submit">Envoyer le message</button>
        <p class="vform__status" role="status" data-form-status></p>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
