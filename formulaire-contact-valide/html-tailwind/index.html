<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulaire de contact avec validation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
      @custom-variant dark {
        @media (prefers-color-scheme: dark) {
          &:where(:root:not([data-theme="light"]), :root:not([data-theme="light"]) *) {
            @slot;
          }
        }
        &:where([data-theme="dark"], [data-theme="dark"] *) {
          @slot;
        }
      }
    </style>
  </head>
  <body class="grid grid-cols-1 min-h-screen place-items-center bg-slate-100 font-sans text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <main class="mx-auto w-[min(100%_-_2rem,34rem)] py-8">
      <form data-validate novalidate action="#envoi" class="grid gap-4.5">
        <div class="grid gap-1.5">
          <label for="contact-name" class="font-semibold">Nom</label>
          <input id="contact-name" type="text" name="name" autocomplete="name" required minlength="2" aria-describedby="contact-name-error" class="w-full rounded-[10px] border-[1.5px] border-slate-400 bg-white px-3.5 py-3 focus:border-blue-700 focus:outline-3 focus:outline-blue-700/30 aria-invalid:border-red-700 dark:border-slate-500 dark:bg-slate-900 dark:focus:border-blue-300 dark:aria-invalid:border-red-300" />
          <p id="contact-name-error" class="text-[0.9rem] font-semibold text-red-700 empty:hidden dark:text-red-300"></p>
        </div>
        <div class="grid gap-1.5">
          <label for="contact-email" class="font-semibold">Adresse e-mail</label>
          <input id="contact-email" type="email" name="email" autocomplete="email" required aria-describedby="contact-email-error" class="w-full rounded-[10px] border-[1.5px] border-slate-400 bg-white px-3.5 py-3 focus:border-blue-700 focus:outline-3 focus:outline-blue-700/30 aria-invalid:border-red-700 dark:border-slate-500 dark:bg-slate-900 dark:focus:border-blue-300 dark:aria-invalid:border-red-300" />
          <p id="contact-email-error" class="text-[0.9rem] font-semibold text-red-700 empty:hidden dark:text-red-300"></p>
        </div>
        <div class="grid gap-1.5">
          <label for="contact-message" class="font-semibold">Message</label>
          <textarea id="contact-message" name="message" rows="5" required minlength="20" aria-describedby="contact-message-hint contact-message-error" class="w-full rounded-[10px] border-[1.5px] border-slate-400 bg-white px-3.5 py-3 focus:border-blue-700 focus:outline-3 focus:outline-blue-700/30 aria-invalid:border-red-700 dark:border-slate-500 dark:bg-slate-900 dark:focus:border-blue-300 dark:aria-invalid:border-red-300"></textarea>
          <p id="contact-message-hint" class="text-sm text-slate-600 dark:text-slate-300">20 caractères au minimum.</p>
          <p id="contact-message-error" class="text-[0.9rem] font-semibold text-red-700 empty:hidden dark:text-red-300"></p>
        </div>
        <button type="submit" class="min-h-12.5 cursor-pointer rounded-[10px] bg-blue-700 font-bold text-white hover:bg-blue-800 focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-blue-700 dark:bg-blue-300 dark:text-[#0b1530] dark:hover:bg-blue-200 dark:focus-visible:outline-blue-300">Envoyer le message</button>
        <p role="status" data-form-status class="font-semibold empty:hidden"></p>
      </form>
    </main>
    <script>
      const messages = {
        valueMissing: "Ce champ est obligatoire.",
        typeMismatch: "Saisissez une adresse e-mail valide, par exemple nom@exemple.fr.",
        tooShort: (field) => `Écrivez au moins ${field.minLength} caractères.`,
      };

      function errorFor(field) {
        const { validity } = field;
        if (validity.valueMissing) return messages.valueMissing;
        if (validity.typeMismatch) return messages.typeMismatch;
        if (validity.tooShort) return messages.tooShort(field);
        return "";
      }

      document.querySelectorAll("[data-validate]").forEach((form) => {
        const status = form.querySelector("[data-form-status]");
        const fields = [...form.querySelectorAll("input, textarea")];

        function show(field) {
          const error = document.getElementById(`${field.id}-error`);
          const message = errorFor(field);
          error.textContent = message;
          field.setAttribute("aria-invalid", String(Boolean(message)));
          return !message;
        }

        fields.forEach((field) => field.addEventListener("blur", () => field.value && show(field)));

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const invalid = fields.filter((field) => !show(field));
          if (invalid.length) {
            status.textContent = `${invalid.length} champ(s) à corriger.`;
            invalid[0].focus();
            return;
          }
          status.textContent = "Merci, votre message a bien été envoyé.";
          form.reset();
        });
      });
    </script>
  </body>
</html>
