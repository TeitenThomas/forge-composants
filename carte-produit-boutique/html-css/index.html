<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carte produit de boutique</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="demo">
      <ul class="demo__grid">
      <li class="product">
        <div class="product__visual" aria-hidden="true"><svg viewBox="0 0 180 160"><path d="M30 70 L90 50 L150 70 L150 120 L30 120 Z" fill="#b9b4ad" /></svg></div>
        <div class="product__body">
          <h2><a href="#produit">Plaid en laine mérinos</a></h2>
          <p class="product__variant">Gris perle, 130 × 170 cm</p>
          <p class="product__rating"><span aria-hidden="true">★★★★★</span><span class="product__hidden">Note : 4,8 sur 5, 126 avis</span><span aria-hidden="true">4,8 (126)</span></p>
          <div class="product__footer">
            <p class="product__price">89 €</p>
            <button type="button">Ajouter au panier</button>
          </div>
        </div>
      </li>
      <li class="product">
        <div class="product__visual" aria-hidden="true"><svg viewBox="0 0 180 160"><path d="M45 60 Q90 40 135 60 L135 115 Q90 130 45 115 Z" fill="#c86f4f" /></svg></div>
        <div class="product__body">
          <h2><a href="#produit">Coussin lin lavé</a></h2>
          <p class="product__variant">Terracotta, 45 × 45 cm</p>
          <p class="product__rating"><span aria-hidden="true">★★★★★</span><span class="product__hidden">Note : 4,6 sur 5, 58 avis</span><span aria-hidden="true">4,6 (58)</span></p>
          <div class="product__footer">
            <p class="product__price">34 €</p>
            <button type="button">Ajouter au panier</button>
          </div>
        </div>
      </li>
      </ul>
    </main>
  </body>
</html>
