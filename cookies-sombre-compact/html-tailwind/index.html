<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bandeau de cookies sombre et compact</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
      @custom-variant dark {
        @media (prefers-color-scheme: dark) {
          &:where(:root:not([data-theme="light"]), :root:not([data-theme="light"]) *) {
            @slot;
          }
        }
        &:where([data-theme="dark"], [data-theme="dark"] *) {
          @slot;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#e7e8ec] font-sans text-[#111216] dark:bg-black dark:text-[#f4f5f7]">
    <main class="">
      <div data-consent-root>
        <section class="fixed inset-x-4 bottom-4 mx-auto max-h-[calc(100vh_-_2rem)] max-w-5xl overflow-y-auto rounded-2xl px-5 py-4 [--r:8px] min-[900px]:grid min-[900px]:grid-cols-[1fr_auto] min-[900px]:items-center min-[900px]:gap-x-8 bg-[#111216] dark:bg-[#0a0b0e] text-[#f4f5f7]" data-consent aria-labelledby="cookies-sombre-compact-title">
          <h2 id="cookies-sombre-compact-title" class="mb-1 text-base font-bold">Nous respectons vos choix</h2>
          <p class="leading-normal text-[#b2b6c0] text-sm">Avec votre accord, nous utilisons des cookies pour mesurer l'audience et personnaliser la publicité. Vous pouvez accepter, refuser ou choisir par catégorie, et changer d'avis à tout moment. <a href="#politique-cookies" class="font-bold underline text-[#f4f5f7] focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-amber-300">Politique de cookies</a></p>
          <fieldset id="cookies-sombre-compact-panel" class="mt-4 grid gap-3 rounded-xl border px-4 pt-3 pb-4 border-[#2c2f38] dark:border-[#24262e] min-[900px]:col-span-2 min-[900px]:row-start-3" data-consent-panel hidden>
            <legend class="px-1.5 font-bold">Vos choix par catégorie</legend>
            <div class="grid grid-cols-[auto_1fr] items-start gap-2.5">
              <input id="cookies-sombre-compact-necessary" type="checkbox" checked disabled class="mt-0.5 size-5 accent-[#f4f5f7] focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-amber-300" />
              <label for="cookies-sombre-compact-necessary" class="grid gap-0.5 font-semibold">Cookies nécessaires<span class="text-sm leading-snug font-normal text-[#b2b6c0]">Panier, connexion et sécurité : toujours actifs, ils ne nécessitent pas de consentement.</span></label>
            </div>
            <div class="grid grid-cols-[auto_1fr] items-start gap-2.5">
              <input id="cookies-sombre-compact-analytics" type="checkbox" data-consent-category="analytics" class="mt-0.5 size-5 accent-[#f4f5f7] focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-amber-300" />
              <label for="cookies-sombre-compact-analytics" class="grid gap-0.5 font-semibold">Mesure d'audience<span class="text-sm leading-snug font-normal text-[#b2b6c0]">Statistiques anonymes de fréquentation pour améliorer le site.</span></label>
            </div>
            <div class="grid grid-cols-[auto_1fr] items-start gap-2.5">
              <input id="cookies-sombre-compact-marketing" type="checkbox" data-consent-category="marketing" class="mt-0.5 size-5 accent-[#f4f5f7] focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-amber-300" />
              <label for="cookies-sombre-compact-marketing" class="grid gap-0.5 font-semibold">Publicité personnalisée<span class="text-sm leading-snug font-normal text-[#b2b6c0]">Annonces adaptées à vos centres d'intérêt sur d'autres sites.</span></label>
            </div>
          </fieldset>
          <div class="mt-3.5 flex flex-wrap gap-2 min-[900px]:col-start-2 min-[900px]:row-span-2 min-[900px]:row-start-1 min-[900px]:mt-0">
            <button type="button" class="min-h-11 cursor-pointer rounded-[var(--r)] border-2 px-4.5 font-bold focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-amber-300 border-[#f4f5f7] bg-[#f4f5f7] text-[#111216]" data-consent-refuse>Tout refuser</button>
          <button type="button" class="min-h-11 cursor-pointer rounded-[var(--r)] border-2 px-4.5 font-bold focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-amber-300 border-transparent underline underline-offset-3" data-consent-customize aria-expanded="false" aria-controls="cookies-sombre-compact-panel">Personnaliser</button>
            <button type="button" class="min-h-11 cursor-pointer rounded-[var(--r)] border-2 px-4.5 font-bold focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-amber-300 bg-transparent border-[#f4f5f7]" data-consent-save hidden>Enregistrer mes choix</button>
            <button type="button" class="min-h-11 cursor-pointer rounded-[var(--r)] border-2 px-4.5 font-bold focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-amber-300 border-[#f4f5f7] bg-[#f4f5f7] text-[#111216]" data-consent-accept>Tout accepter</button>
          </div>
        </section>
        <button type="button" class="fixed bottom-4 left-4 min-h-11 cursor-pointer rounded-full border px-4.5 font-semibold shadow-[0_8px_24px_-12px_rgb(0_0_0/0.4)] focus-visible:outline-3 focus-visible:outline-offset-2 bg-[#111216] dark:bg-[#0a0b0e] text-[#f4f5f7] border-[#2c2f38] dark:border-[#24262e] focus-visible:outline-amber-300" data-consent-manage hidden>Gérer les cookies</button>
      </div>
    </main>
    <script>
      const STORAGE_KEY = "forge-consent";
      // The CNIL recommends asking again after six months.
      const MAX_AGE = 1000 * 60 * 60 * 24 * 182;

      function readConsent() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return stored && Date.now() - Date.parse(stored.date) < MAX_AGE ? stored : null;
        } catch {
          return null;
        }
      }

      function writeConsent(choices) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...choices, date: new Date().toISOString() }));
        } catch {
          // Storage can be blocked: the choice still applies to the current page.
        }
      }

      document.querySelectorAll("[data-consent-root]").forEach((root) => {
        const banner = root.querySelector("[data-consent]");
        const panel = root.querySelector("[data-consent-panel]");
        const customize = root.querySelector("[data-consent-customize]");
        const save = root.querySelector("[data-consent-save]");
        const manage = root.querySelector("[data-consent-manage]");
        const boxes = [...root.querySelectorAll("[data-consent-category]")];
        const every = (value) => Object.fromEntries(boxes.map((box) => [box.dataset.consentCategory, value]));

        function apply(choices) {
          boxes.forEach((box) => {
            box.checked = Boolean(choices[box.dataset.consentCategory]);
          });
          banner.hidden = true;
          manage.hidden = false;
          root.dispatchEvent(new CustomEvent("consentchange", { bubbles: true, detail: Object.fromEntries(boxes.map((box) => [box.dataset.consentCategory, box.checked])) }));
        }

        function decide(choices) {
          writeConsent(choices);
          apply(choices);
          manage.focus();
        }

        root.querySelector("[data-consent-accept]").addEventListener("click", () => decide(every(true)));
        root.querySelector("[data-consent-refuse]").addEventListener("click", () => decide(every(false)));
        save.addEventListener("click", () => decide(Object.fromEntries(boxes.map((box) => [box.dataset.consentCategory, box.checked]))));
        customize?.addEventListener("click", () => {
          const opening = panel.hidden;
          panel.hidden = !opening;
          save.hidden = !opening;
          customize.setAttribute("aria-expanded", String(opening));
          if (opening) panel.querySelector("input:not([disabled])").focus();
        });
        manage.addEventListener("click", () => {
          banner.hidden = false;
          manage.hidden = true;
          banner.querySelector("button").focus();
        });

        const stored = readConsent();
        if (stored) apply(stored);
      });
    </script>
  </body>
</html>
