<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Points rebondissants</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <style type="text/tailwindcss">
      @custom-variant dark {
        @media (prefers-color-scheme: dark) {
          &:where(:root:not([data-theme="light"]), :root:not([data-theme="light"]) *) {
            @slot;
          }
        }
        &:where([data-theme="dark"], [data-theme="dark"] *) {
          @slot;
        }
      }
      @keyframes dots-bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }

        40% {
          transform: translateY(-0.4rem);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="grid min-h-screen grid-cols-1 place-items-center bg-[#faf8ff] font-sans text-[#1e1145] dark:bg-[#0c0619] dark:text-violet-50">
    <main class="mx-auto w-[min(100%_-_2rem,24rem)] py-8">
      <div role="status" class="inline-flex items-center gap-3 rounded-[18px_18px_18px_4px] bg-violet-100 px-4.5 py-3 text-[0.95rem] text-[#3b2a73] dark:bg-[#1e1240] dark:text-violet-200">
        <span aria-hidden="true" class="flex gap-1.5">
          <span class="size-2 animate-[dots-bounce_1s_ease-in-out_infinite] rounded-full bg-violet-700 [animation-delay:-0.32s] motion-reduce:[animation-duration:3s] dark:bg-violet-300"></span>
          <span class="size-2 animate-[dots-bounce_1s_ease-in-out_infinite] rounded-full bg-violet-700 [animation-delay:-0.16s] motion-reduce:[animation-duration:3s] dark:bg-violet-300"></span>
          <span class="size-2 animate-[dots-bounce_1s_ease-in-out_infinite] rounded-full bg-violet-700 motion-reduce:[animation-duration:3s] dark:bg-violet-300"></span>
        </span>
        <span>Votre conseillère écrit</span>
      </div>
    </main>
  </body>
</html>
